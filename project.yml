name: BragLog
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.braglog
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  BragLog:
    type: application
    platform: iOS
    sources: [BragLog, Shared]
    dependencies:
      - target: BragLogWidget
        embed: true
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BragLog AppStore
    entitlements:
      path: BragLog/BragLog.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.braglog]
    info:
      path: BragLog/Info.plist
      properties:
        CFBundleDisplayName: Brag Log
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        NSCameraUsageDescription: Use the camera to attach evidence to a work win.
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.braglog.capture
            CFBundleURLSchemes: [braglog]
  BragLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - BragLogWidget
      - path: Shared
        excludes: [Entitlement.swift, Launch.swift, Journal.swift, Export.swift, JournalCSV.swift, ShareArt.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hgsldswk.braglog.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: BragLog Widget AppStore
    entitlements:
      path: BragLogWidget/BragLogWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.braglog]
    info:
      path: BragLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Brag Log
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BragLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BragLogTests, Shared, BragLog/JournalDatabase.swift, BragLog/Media.swift]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  BragLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BragLogUITests]
    dependencies:
      - target: BragLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BragLog
schemes:
  BragLog:
    build:
      targets:
        BragLog: all
        BragLogTests: [test]
    test:
      config: Debug
      targets: [BragLogTests]
  BragLogUI:
    build:
      targets:
        BragLog: all
        BragLogUITests: [test]
    test:
      config: Debug
      targets: [BragLogUITests]
